# Week 8 lab, Step 6. YOUR M3 image on YOUR cluster - the first step of M4.
# Fill the four ____ blanks, then:
#   kubectl apply -f playground/mine.yaml
#   kubectl rollout status deployment/mine --timeout=120s
#   kubectl port-forward service/mine 8080:80      and in another terminal:
#   curl -i localhost:8080/healthz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          # 7. your M3 image: owner/project in lowercase, a colon, the FULL 40-character SHA
          image: ghcr.io/240107006-oss/inf345-project:f9de71f4858c8cfafd4ed204cb3d2f55a952a6f4
          env:
            - name: PORT
              value: "8080"               # 8. the port your app should listen on - you choose it
          ports:
            - containerPort: 8080         # 9. the same number as 8
---
apiVersion: v1
kind: Service
metadata:
  name: mine
spec:
  selector:
    app: mine
  ports:
    - port: 80
      targetPort: 8080                  # 10. the same number again
